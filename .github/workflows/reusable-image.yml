name: Reusable container image

on:
  workflow_call:
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.publish.outputs.digest }}
    inputs:
      name:
        description: Human-readable component name
        required: true
        type: string
      image:
        description: Fully qualified container image name
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string
      cache_scope:
        description: Stable cache and artifact prefix
        required: true
        type: string
      architectures:
        description: JSON array of architectures published in the image manifest
        required: false
        type: string
        default: '["amd64", "arm64"]'
      build_args:
        description: Newline-delimited Docker build arguments
        required: false
        type: string
        default: ""
      tags:
        description: Newline-delimited docker/metadata-action tag rules
        required: false
        type: string
        default: |
          type=sha,prefix=sha-
      publish_manifest:
        description: Whether this workflow should publish the multi-platform manifest
        required: false
        type: boolean
        default: true
      nightly_version:
        description: Derive KILN_VERSION and a version tag from release.json and the source commit timestamp
        required: false
        type: boolean
        default: false
      prepare_sentry_source_maps:
        description: Export source maps from the exact amd64 image build
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ inputs.name }}${{ matrix.architecture == 'arm64' && ' · arm64' || '' }}
    # Public-repository runners keep PRs and manual builds free. Blacksmith is
    # reserved for the latency-sensitive image builds triggered by main.
    runs-on: ${{ github.event_name == 'push' && (matrix.architecture == 'arm64' && 'blacksmith-4vcpu-ubuntu-2404-arm' || 'blacksmith-4vcpu-ubuntu-2404') || (matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architectures) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve nightly version
        if: inputs.nightly_version
        id: nightly
        run: |
          release_line="$(jq -er '.releaseLine' release.json)"
          commit_timestamp="$(git show -s --format=%cI "$GITHUB_SHA")"
          timestamp="$(date -u -d "$commit_timestamp" +%Y%m%d.%H%M%S)"
          echo "version=${release_line}-nightly.${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          flavor: latest=false
          tags: |
            ${{ inputs.tags }}
            ${{ inputs.nightly_version && format('type=raw,value={0}', steps.nightly.outputs.version) || '' }}

      - name: Prepare Sentry source maps
        if: github.event_name != 'pull_request' && inputs.prepare_sentry_source_maps && matrix.architecture == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: sentry-source-maps
          build-args: |
            ${{ inputs.build_args }}
            ${{ inputs.nightly_version && format('KILN_VERSION={0}', steps.nightly.outputs.version) || '' }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=local,dest=/tmp/sentry-source-maps
          cache-from: type=registry,ref=ghcr.io/kiln-site/${{ inputs.cache_scope }}-build-cache:${{ matrix.architecture }}
          provenance: false
          sbom: false

      - name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            ${{ inputs.build_args }}
            ${{ inputs.nightly_version && format('KILN_VERSION={0}', steps.nightly.outputs.version) || '' }}
          platforms: linux/${{ matrix.architecture }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
          labels: ${{ steps.metadata.outputs.labels }}
          # PRs refresh the shared dependency cache. Main only imports it so
          # publishing is not delayed by a remote cache export.
          cache-from: type=registry,ref=ghcr.io/kiln-site/${{ inputs.cache_scope }}-build-cache:${{ matrix.architecture }}
          cache-to: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref=ghcr.io/kiln-site/{0}-build-cache:{1},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd', inputs.cache_scope, matrix.architecture) || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=min' || 'false' }}
          sbom: false

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.cache_scope }}-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload prepared Sentry source maps
        if: github.event_name != 'pull_request' && inputs.prepare_sentry_source_maps && matrix.architecture == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-sentry-source-maps
          path: |
            /tmp/sentry-source-maps/**/*.js
            /tmp/sentry-source-maps/**/*.mjs
            /tmp/sentry-source-maps/**/*.map
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  publish:
    name: Publish ${{ inputs.name }} manifest
    if: github.event_name != 'pull_request' && inputs.publish_manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ inputs.cache_scope }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          flavor: latest=false
          tags: ${{ inputs.tags }}

      - name: Create and verify multi-platform manifest
        id: manifest
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          IMAGE: ${{ inputs.image }}
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          test "${#tags[@]}" -gt 0

          expected_architectures="$(jq 'length' <<< "$ARCHITECTURES")"
          test "$expected_architectures" -gt 0

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq "$expected_architectures"

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          digest="sha256:$(docker buildx imagetools inspect "${tags[0]}" --raw | sha256sum | awk '{print $1}')"
          test "${#digest}" -eq 71
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
