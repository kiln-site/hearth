name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiln-release-line
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  code:
    name: Code checks
    uses: ./.github/workflows/ci.yml

  hearth_arm:
    name: Hearth arm64 image
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Hearth
      image: ghcr.io/kiln-site/hearth
      dockerfile: apps/web/Dockerfile
      cache_scope: hearth
      architectures: '["arm64"]'
      arm_runner: blacksmith-8vcpu-ubuntu-2404-arm
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.1' }}
        VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
      tags: |
        type=sha,prefix=sha-
      nightly_version: true
      publish_manifest: false

  hearth_amd:
    name: Hearth amd64 image
    needs: code
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Hearth
      image: ghcr.io/kiln-site/hearth
      dockerfile: apps/web/Dockerfile
      cache_scope: hearth
      architectures: '["amd64"]'
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.1' }}
        VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
      tags: |
        type=sha,prefix=sha-
      uses_sentry: true
      nightly_version: true
      publish_manifest: false
    secrets:
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  relay:
    name: Relay image
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Relay
      image: ghcr.io/kiln-site/relay
      dockerfile: apps/relay/Dockerfile
      cache_scope: relay
      arm_runner: blacksmith-8vcpu-ubuntu-2404-arm
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
      tags: |
        type=sha,prefix=sha-
      nightly_version: true
      publish_manifest: false

  release:
    name: Publish nightly release
    needs: [code, hearth_arm, hearth_amd, relay]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve nightly version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          release_line="$(jq -er '.releaseLine' release.json)"
          tag="v${release_line}-nightly.${RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Reserve version tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$COMMIT_SHA"
          else
            git tag "$TAG" "$COMMIT_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests

      - name: Publish and verify image manifests
        id: manifests
        env:
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob

          publish_manifest() {
            component="$1"
            image="$2"
            digest_files=(/tmp/digests/digests-"$component"-*/*)
            test "${#digest_files[@]}" -eq 2

            sources=()
            for digest_file in "${digest_files[@]}"; do
              sources+=("$image@sha256:$(basename "$digest_file")")
            done

            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --tag "$image:sha-${COMMIT_SHA:0:7}" \
              "${sources[@]}"
            docker buildx imagetools inspect "$image:$VERSION"

            digest="sha256:$(docker buildx imagetools inspect "$image:$VERSION" --raw | sha256sum | awk '{print $1}')"
            test "${#digest}" -eq 71
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          }

          publish_manifest hearth ghcr.io/kiln-site/hearth
          publish_manifest relay ghcr.io/kiln-site/relay

      - name: Create release manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
          HEARTH_DIGEST: ${{ steps.manifests.outputs.hearth_digest }}
          RELAY_DIGEST: ${{ steps.manifests.outputs.relay_digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$COMMIT_SHA" \
            --arg publishedAt "$(date -u +%FT%TZ)" \
            --arg hearthDigest "$HEARTH_DIGEST" \
            --arg relayDigest "$RELAY_DIGEST" \
            '{
              schemaVersion: 1,
              version: $version,
              channel: "nightly",
              commit: $commit,
              publishedAt: $publishedAt,
              components: {
                hearth: { image: "ghcr.io/kiln-site/hearth", digest: $hearthDigest },
                relay: { image: "ghcr.io/kiln-site/relay", digest: $relayDigest }
              },
              compatibility: { relayProtocol: 1 }
            }' > release-manifest.json

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-manifest.json --clobber
          else
            gh release create "$TAG" release-manifest.json \
              --prerelease \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi

      - name: Check whether this is the newest published nightly
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          newest="$(gh release list --limit 100 --json isPrerelease,tagName \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^v0\.[0-9]+\.[0-9]+-nightly\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"
          if test "$newest" = "$TAG"; then
            echo "advance=true" >> "$GITHUB_OUTPUT"
          else
            echo "advance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Advance rolling tags
        if: steps.newest.outputs.advance == 'true'
        env:
          HEARTH_DIGEST: ${{ steps.manifests.outputs.hearth_digest }}
          RELAY_DIGEST: ${{ steps.manifests.outputs.relay_digest }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/kiln-site/hearth:latest-nightly \
            "ghcr.io/kiln-site/hearth@$HEARTH_DIGEST"
          docker buildx imagetools create \
            --tag ghcr.io/kiln-site/relay:latest-nightly \
            "ghcr.io/kiln-site/relay@$RELAY_DIGEST"

          release_line="$(jq -er '.releaseLine' release.json)"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$release_line" >/dev/null 2>&1; then
            docker buildx imagetools create \
              --tag ghcr.io/kiln-site/hearth:latest \
              "ghcr.io/kiln-site/hearth@$HEARTH_DIGEST"
            docker buildx imagetools create \
              --tag ghcr.io/kiln-site/relay:latest \
              "ghcr.io/kiln-site/relay@$RELAY_DIGEST"
          fi
