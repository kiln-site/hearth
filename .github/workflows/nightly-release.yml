name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiln-release-line
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  code:
    name: Code checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Reserve nightly version
    needs: code
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Reserve the next version tag
        id: version
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          release_line="$(git show origin/main:release.json | jq -er '.releaseLine')"
          existing="$(git tag --points-at "$COMMIT_SHA" --list "v${release_line}-nightly.*" --sort=-v:refname | head -n 1)"
          if test -n "$existing"; then
            tag="$existing"
          else
            reserved=false
            for attempt in $(seq 1 20); do
              git fetch --force --tags origin
              last="$(git tag --list "v${release_line}-nightly.*" --sort=-v:refname | head -n 1)"
              increment="${last##*.}"
              if test -z "$last"; then increment=0; fi
              increment="$((increment + 1))"
              tag="v${release_line}-nightly.${increment}"
              git tag "$tag" "$COMMIT_SHA"
              if git push origin "refs/tags/$tag"; then
                reserved=true
                break
              fi
              git tag --delete "$tag"
              if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "Could not reserve $tag" >&2
                exit 1
              fi
            done
            test "$reserved" = true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  hearth:
    name: Hearth image
    needs: version
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Hearth
      image: ghcr.io/kiln-site/hearth
      dockerfile: apps/web/Dockerfile
      cache_scope: hearth
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        KILN_VERSION=${{ needs.version.outputs.version }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.1' }}
        VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
      tags: |
        type=raw,value=${{ needs.version.outputs.version }}
        type=sha,prefix=sha-
      uses_sentry: true
    secrets:
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  relay:
    name: Relay image
    needs: version
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Relay
      image: ghcr.io/kiln-site/relay
      dockerfile: apps/relay/Dockerfile
      cache_scope: relay
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        KILN_VERSION=${{ needs.version.outputs.version }}
      tags: |
        type=raw,value=${{ needs.version.outputs.version }}
        type=sha,prefix=sha-

  release:
    name: Publish nightly release
    needs: [version, hearth, relay]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify images are publicly readable
        env:
          HEARTH_DIGEST: ${{ needs.hearth.outputs.digest }}
          RELAY_DIGEST: ${{ needs.relay.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/kiln-site/hearth@$HEARTH_DIGEST"
          docker buildx imagetools inspect "ghcr.io/kiln-site/relay@$RELAY_DIGEST"

      - name: Create release manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
          HEARTH_DIGEST: ${{ needs.hearth.outputs.digest }}
          RELAY_DIGEST: ${{ needs.relay.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$COMMIT_SHA" \
            --arg publishedAt "$(date -u +%FT%TZ)" \
            --arg hearthDigest "$HEARTH_DIGEST" \
            --arg relayDigest "$RELAY_DIGEST" \
            '{
              schemaVersion: 1,
              version: $version,
              channel: "nightly",
              commit: $commit,
              publishedAt: $publishedAt,
              components: {
                hearth: { image: "ghcr.io/kiln-site/hearth", digest: $hearthDigest },
                relay: { image: "ghcr.io/kiln-site/relay", digest: $relayDigest }
              },
              compatibility: { relayProtocol: 1 }
            }' > release-manifest.json

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-manifest.json --clobber
          else
            gh release create "$TAG" release-manifest.json \
              --prerelease \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi

      - name: Check whether this is the newest published nightly
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          newest="$(gh release list --limit 100 --json isPrerelease,tagName \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^v0\.[0-9]+\.[0-9]+-nightly\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"
          if test "$newest" = "$TAG"; then
            echo "advance=true" >> "$GITHUB_OUTPUT"
          else
            echo "advance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.newest.outputs.advance == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance rolling tags
        if: steps.newest.outputs.advance == 'true'
        env:
          HEARTH_DIGEST: ${{ needs.hearth.outputs.digest }}
          RELAY_DIGEST: ${{ needs.relay.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/kiln-site/hearth:latest-nightly \
            "ghcr.io/kiln-site/hearth@$HEARTH_DIGEST"
          docker buildx imagetools create \
            --tag ghcr.io/kiln-site/relay:latest-nightly \
            "ghcr.io/kiln-site/relay@$RELAY_DIGEST"

          release_line="$(jq -er '.releaseLine' release.json)"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$release_line" >/dev/null 2>&1; then
            docker buildx imagetools create \
              --tag ghcr.io/kiln-site/hearth:latest \
              "ghcr.io/kiln-site/hearth@$HEARTH_DIGEST"
            docker buildx imagetools create \
              --tag ghcr.io/kiln-site/relay:latest \
              "ghcr.io/kiln-site/relay@$RELAY_DIGEST"
          fi
