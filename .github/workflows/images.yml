name: Container images

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  code:
    name: Code checks
    uses: ./.github/workflows/ci.yml

  images:
    name: ${{ matrix.name }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hearth
            image: ghcr.io/kiln-site/hearth
            dockerfile: apps/web/Dockerfile
            cache_scope: hearth
            build_args: |
              SOURCE_COMMIT=${{ github.sha }}
              KILN_VERSION=0.1.0-pr.${{ github.event.pull_request.number || github.run_number }}
              VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
              VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.1' }}
              VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            uses_sentry: true
          - name: Relay
            image: ghcr.io/kiln-site/relay
            dockerfile: apps/relay/Dockerfile
            cache_scope: relay
            build_args: |
              SOURCE_COMMIT=${{ github.sha }}
              KILN_VERSION=0.1.0-pr.${{ github.event.pull_request.number || github.run_number }}
            uses_sentry: false
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      cache_scope: ${{ matrix.cache_scope }}
      build_args: ${{ matrix.build_args }}
      tags: |
        type=sha,prefix=sha-
      uses_sentry: ${{ matrix.uses_sentry }}
    secrets:
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
