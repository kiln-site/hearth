name: Stable release

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Nightly version to promote, without the leading v
        required: true
        type: string
      next_release:
        description: Next 0.x.x release line for future nightlies
        required: true
        type: string

concurrency:
  group: kiln-release-line
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  promote:
    name: Promote nightly
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main

      - name: Validate promotion
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
          NEXT_RELEASE: ${{ inputs.next_release }}
        run: |
          release_line="$(jq -er '.releaseLine' release.json)"
          stable_version="${NIGHTLY%%-nightly.*}"
          printf '%s\n' "$stable_version" | grep -Eq '^0\.[0-9]+\.[0-9]+$'
          printf '%s\n' "$NEXT_RELEASE" | grep -Eq '^0\.[0-9]+\.[0-9]+$'
          case "$NIGHTLY" in
            "$stable_version"-nightly.*) ;;
            *) echo "Nightly version is invalid" >&2; exit 1 ;;
          esac
          increment="${NIGHTLY#"$stable_version-nightly."}"
          case "$increment" in
            ''|*[!0-9]*) echo "Nightly increment is invalid" >&2; exit 1 ;;
          esac
          case "$release_line" in
            "$stable_version"|"$NEXT_RELEASE") ;;
            *) echo "release.json must contain $stable_version or $NEXT_RELEASE" >&2; exit 1 ;;
          esac
          test "$NEXT_RELEASE" != "$stable_version"
          test "$(printf '%s\n%s\n' "$stable_version" "$NEXT_RELEASE" | sort -V | tail -n 1)" = "$NEXT_RELEASE"
          test "$(gh release view "v$NIGHTLY" --json isPrerelease --jq '.isPrerelease')" = true
          gh release download "v$NIGHTLY" --pattern release-manifest.json
          test "$(jq -r '.version' release-manifest.json)" = "$NIGHTLY"
          test "$(jq -r '.channel' release-manifest.json)" = nightly
          newest="$(gh release list --limit 100 --json isPrerelease,tagName \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E "^v${stable_version//./\\.}-nightly\\.[0-9]+$" \
            | sort -V \
            | tail -n 1)"
          test "$newest" = "v$NIGHTLY"
          echo "version=$stable_version" >> "$GITHUB_OUTPUT"
          echo "next_release=$NEXT_RELEASE" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=v$NIGHTLY" >> "$GITHUB_OUTPUT"

      - name: Reserve stable tag
        env:
          NIGHTLY_TAG: ${{ steps.version.outputs.nightly_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nightly_commit="$(git rev-list -n 1 "$NIGHTLY_TAG")"
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$nightly_commit"
          else
            git tag "v$VERSION" "$nightly_commit"
            git push origin "refs/tags/v$VERSION"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote immutable image digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for component in hearth relay; do
            image="$(jq -r ".components.$component.image" release-manifest.json)"
            digest="$(jq -r ".components.$component.digest" release-manifest.json)"
            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --tag "$image:latest" \
              "$image@$digest"
          done

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg version "$VERSION" \
            --arg publishedAt "$(date -u +%FT%TZ)" \
            '.version = $version | .channel = "stable" | .publishedAt = $publishedAt' \
            release-manifest.json > promoted-release-manifest.json
          mv promoted-release-manifest.json release-manifest.json
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release-manifest.json --clobber
          else
            gh release create "v$VERSION" release-manifest.json \
              --verify-tag \
              --generate-notes \
              --title "v$VERSION"
          fi

      - name: Advance the nightly release line
        env:
          NEXT_RELEASE: ${{ steps.version.outputs.next_release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B kiln-release-line origin/main
            current="$(jq -er '.releaseLine' release.json)"
            if test "$current" = "$NEXT_RELEASE"; then
              exit 0
            fi
            test "$current" = "$VERSION"
            jq --arg next "$NEXT_RELEASE" '.releaseLine = $next' \
              release.json > release.next.json
            mv release.next.json release.json
            git add release.json
            git commit -m "chore: start $NEXT_RELEASE nightlies"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not advance release.json after five attempts" >&2
          exit 1
